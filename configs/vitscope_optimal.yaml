# configs/vitscope_optimal.yaml - 针对num_workers=4的最优配置
task: cls
model: vitscope
data_dir: /home2/dnrx52/vitcope
bs: 256                # 平衡性能，4个workers可以应付
num_workers: 4
size: 224
n_epochs: 100
patch: 32              # ViT Tiny架构
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 3e-4               # 基础学习率（和原始论文一致）
min_lr: 1e-5
warmup_epochs: 5
opt: adamw
amp: true
aug: false             # 关闭数据增强减轻CPU负担
nowandb: false

