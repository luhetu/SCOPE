# configs/detection_vitscope_rebuttal.yaml - ViT+SCoPE + Mask R-CNN for COCO (3x)
task: det
model: vitscope

# Data configuration
data_dir: /home3/dnrx52/copeondet/datasets/coco
bs: 8
pretrained: ./checkpoint/pretrained/vitscope_pretrained.pth
img_scale: [1024, 640]  # faster, lower memory

# ViT-Tiny configuration
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# Training configuration (3x schedule)
n_epochs: 36
lr: 0.0001
min_lr: 0.000001
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false
