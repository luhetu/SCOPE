task: seg
model: vitcope
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 16
pretrained: ./checkpoint/pretrained/COPE/vitcope_cls_size224_patch16_dim384_depth12_best.pth
size: 224
test_img_scale: [2048, 512]
img_scale: [2048, 512]
crop_size: 512
patch: 16
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64

# ADE20K UPerNet protocol from the paper: report 40K / 160K schedules.
# Keep n_epochs only as an approximate reference; train.py uses max_iters.
max_iters: 40000
n_epochs: 32
lr: 6e-5
min_lr: 0
warmup_iters: 1500
weight_decay: 0.01
opt: adamw
amp: true
nowandb: false
use_cls_token: false
drop_path_rate: 0.1
