# configs/seg_vit.yaml - ViT + UPerNet for ADE20K
task: seg
model: vit

# 数据配置
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 1

# ViT 配置 (Tiny)
size: 512
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# 训练配置
n_epochs: 80
lr: 6e-5
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.01
opt: adamw
amp: false
nowandb: false

