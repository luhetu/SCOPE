# configs/seg_vitcope.yaml - ViT+CoPE + UPerNet for ADE20K
task: seg
model: vitcope

# Data configuration
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 8
pretrained: ./checkpoint/vitcope_cls_size224_patch16_dim192_depth12_0421_235647_best.pth  # 68.13%

# ViT+CoPE configuration (Tiny)
size: 224
test_img_scale: [2048, 512]
img_scale: [2048, 512]
crop_size: 512
patch: 16  # ViT-Tiny configuration
dim: 192   # ViT-Tiny configuration
depth: 12  # ViT-Tiny configuration
heads: 3   # ViT-Tiny configuration
mlp_dim: 768  # ViT-Tiny configuration
dim_head: 64

# Training configuration (80k iterations, aligned with seg_vit)
n_epochs: 32
lr: 3e-5
min_lr: 0
warmup_iters: 1500
weight_decay: 0.01
opt: adamw
amp: false
nowandb: false
use_cls_token: false
drop_path_rate: 0.1

