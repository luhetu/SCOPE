# configs/vitscope_balanced.yaml - Balanced configuration (optimized for num_workers=4)
task: cls
model: vitscope_nocls
data_dir: /home3/dnrx52/vitcope
bs: 128                # Swin-style small batch size, optimal for num_workers=4
num_workers: 4
size: 224
n_epochs: 100
patch: 32              # ViT Tiny architecture
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 1.5e-4             # Learning rate for bs=128 (half of base 3e-4)
min_lr: 5e-6           # Correspondingly reduced min_lr
warmup_epochs: 5
opt: adamw
amp: true
aug: false             # Disable RandAugment to reduce CPU burden
nowandb: false

