task: seg
model: vit
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 16
pretrained: ./checkpoint/pretrained/vit_cls_size224_patch16_dim192_depth12_best.pth
size: 224
test_img_scale: [2048, 512]
img_scale: [2048, 512]
crop_size: 512
seg_neck_style: xcit_fpn
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64
out_indices: [3, 5, 7, 11]

# ADE20K UPerNet 40K protocol; n_epochs is kept as an approximate reference.
max_iters: 40000
n_epochs: 32
lr: 6e-5
min_lr: 0
warmup_iters: 1500
weight_decay: 0.01
layer_decay_rate: 1.0
opt: adamw
amp: true
nowandb: false

# Strict ViT-Tiny segmentation protocol
seg_head_dim: 192
seg_aux_dim: 192
seg_aux_in_index: 2
seg_norm_type: SyncBN
drop_path_rate: 0.0
