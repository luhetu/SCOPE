# configs/detection_vit.yaml - ViT + Mask R-CNN
task: det
model: vit

# 数据配置
data_dir: ./datasets/coco
bs: 2
pretrained: ./checkpoint/vit-16-imagenet-1k-original-ckpt.t7
img_scale: (512, 512)  # 平衡分辨率

# ViT 配置
size: 224
patch: 32
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64

# 训练配置
n_epochs: 12
lr: 1e-4  # bs=2, 标准学习率
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

