# configs/detection_vit.yaml - ViT + Mask R-CNN
task: det
model: vit

# 数据配置
data_dir: ./datasets/coco
bs: 1
pretrained: ./checkpoint/vit-16-imagenet-1k-original-ckpt.t7
img_scale: (320, 320)  # 进一步降低分辨率避免 OOM

# ViT 配置 (Tiny)
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# 训练配置
n_epochs: 12
lr: 5e-5  # bs=1, 学习率相应降低
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

