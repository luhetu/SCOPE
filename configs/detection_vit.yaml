# configs/detection_vit.yaml - ViT + Mask R-CNN
task: det
model: vit

# 数据配置
data_dir: /home2/dnrx52/copeondet/datasets/coco
bs: 2
pretrained: ./checkpoint/vit_pretrained.pth
img_scale: [1333, 800]  # COCO 标准分辨率（使用列表而非元组）

# ViT 配置 (Tiny)
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# 训练配置
n_epochs: 12
lr: 5e-5
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false
