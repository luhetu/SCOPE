# configs/detection_vit.yaml - ViT + Mask R-CNN
task: det
model: vit

# Data configuration
data_dir: /home3/dnrx52/SCOPE/datasets/coco
bs: 8
pretrained: ./checkpoint/vit_pretrained.pth
det_neck_type: fpn  # Paper-style Mask R-CNN + FPN
img_scale: [768, 768]  # COCO standard resolution

# ViT configuration (Tiny)
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# Training configuration (3x schedule)
n_epochs: 12
lr: 0.0001
min_lr: 0.000001
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false
