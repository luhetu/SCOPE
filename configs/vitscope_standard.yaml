# configs/vitscope_standard.yaml - 标准配置，用于公平比较
task: cls
model: vitscope
data_dir: /home2/dnrx52/vitcope
bs: 256                # 标准batch size，所有GPU都能运行
num_workers: 4         # 集群限制为4
size: 224
n_epochs: 100
patch: 32
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 3e-4               # 标准学习率
min_lr: 1e-5
warmup_epochs: 2
opt: adamw
amp: true
aug: true
nowandb: false

