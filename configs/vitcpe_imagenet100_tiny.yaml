# configs/vitcpe_imagenet100_tiny.yaml - ViT-CPE Tiny on ImageNet-100
task: cls
model: vitcpe
dataset: imagenet100
data_dir: /home3/dnrx52/vitcope/vitcifar/new-imagenet100-folder

bs: 128
size: 256
n_epochs: 150
patch: 32

dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64

lr: 1e-4
min_lr: 0
warmup_epochs: 0
opt: adamw
amp: true
aug: true
mixup: true
cutmix: true
random_erasing: true
repeated_augmentations: true
label_smoothing: true
stochastic_depth: true
drop_path_rate: 0.1
nowandb: false
weight_decay: 0.05
betas: [0.9, 0.999]
lrschedule: one_cycle_cosine
