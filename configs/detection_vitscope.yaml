# configs/detection_vitscope.yaml - ViT+SCoPE + Mask R-CNN
task: det
model: vitscope

# 数据配置
data_dir: /home2/dnrx52/copeondet/datasets/coco
bs: 2
pretrained: ./checkpoint/vitscope_best.pth
img_scale: [1333, 800]  # COCO 标准分辨率（使用列表而非元组）

# ViT+SCoPE 配置（匹配预训练模型）
size: 224
patch: 32
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64

# 训练配置
n_epochs: 12
lr: 5e-5
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false
