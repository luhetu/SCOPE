# Standard segmentation config (ADE20K + UPerNet)
# Notes:
# - Uses 512 crop and ~80k iterations.
# - Adjust bs/model/pretrained as needed for your GPU.
task: seg
model: vitcope

# Data configuration
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 4
pretrained: ./checkpoint/vitcope_cls_size224_patch16_dim192_depth12_0421_235647_best.pth  # 68.13%

# Backbone/pretrain configuration (Tiny ImageNet checkpoint size)
size: 512
test_img_scale: [2048, 512]
img_scale: [2048, 512]
crop_size: 512
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# Training configuration (~80k iters for ADE20K when bs=4)
n_epochs: 16
lr: 1.5e-5
min_lr: 0
warmup_iters: 1500
weight_decay: 0.01
opt: adamw
amp: false
nowandb: false
use_cls_token: false
drop_path_rate: 0.1

