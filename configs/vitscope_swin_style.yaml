# configs/vitscope_swin_style.yaml - Imitating Swin official configuration
task: cls
model: vitscope_nocls
data_dir: /home3/dnrx52/vitcope
bs: 128                # Same batch size as Swin
num_workers: 4
size: 224
n_epochs: 100
patch: 32              # ViT Tiny architecture
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 1.5e-4             # Half of base learning rate (bs=128)
min_lr: 5e-6
warmup_epochs: 5
opt: adamw
amp: true
aug: true
mixup: true
cutmix: true
random_erasing: true
repeated_augmentations: true
label_smoothing: true
stochastic_depth: true
drop_path_rate: 0.1
nowandb: false

weight_decay: 0.05
betas: [0.9, 0.999]
lrschedule: one_cycle_cosine
