# configs/seg_vitscope.yaml - ViT+SCoPE + UPerNet for ADE20K
task: seg
model: vitscope

# Data configuration
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 16  # 🔧 Optimization: increased from 8 to 16, speeds up training
pretrained: ./checkpoint/pretrained/vitscope_pretrained.pth  # ✅ Fix: use correct SCoPE weights!

# ViT+SCoPE configuration (Tiny)
size: 224
patch: 16  # ViT-Tiny configuration
dim: 192   # ViT-Tiny configuration
depth: 12  # ViT-Tiny configuration
heads: 3   # ViT-Tiny configuration
mlp_dim: 768  # ViT-Tiny configuration
dim_head: 64

# Training configuration (40K iterations - paper standard)
n_epochs: 32  # 32 epochs × 1263 iters/epoch ≈ 40K iterations
lr: 0.00006  # 🔧 Optimization: double the learning rate (6e-5, corresponding to bs=16)
min_lr: 0
warmup_epochs: 0.9
weight_decay: 0.01
opt: adamw
amp: true  # 🔧 Optimization: enable mixed precision, speeds up 40-60%
nowandb: false

