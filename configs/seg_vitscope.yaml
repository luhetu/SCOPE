# configs/seg_vitscope.yaml - ViT+SCoPE + UPerNet for ADE20K
task: seg
model: vitscope

# 数据配置
data_dir: /home/hetu/MY project/SCOPE/datasets/ADE20K/ADEChallengeData2016
bs: 2

# ViT+SCoPE 配置 (Tiny)
