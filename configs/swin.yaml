# configs/swin.yaml - Swin Transformer Tiny
task: cls
model: swin
data_dir: /home/hetu/ImageNet
bs: 128
size: 224
n_epochs: 100
patch: 4
embed_dim: 96
depths: [2, 2, 6, 2]
num_heads: [3, 6, 12, 24]
window_size: 7
drop_path_rate: 0.2
lr: 1e-3
min_lr: 1e-5
warmup_epochs: 5
opt: adamw
amp: true
aug: true
mixup: true
cutmix: true
random_erasing: true
repeated_augmentations: true
label_smoothing: true
stochastic_depth: true
nowandb: false

weight_decay: 0.05
betas: [0.9, 0.999]
lrschedule: one_cycle_cosine
