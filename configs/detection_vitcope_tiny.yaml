task: det
model: vitcope
data_dir: /tmp/vitcope
bs: 8
pretrained: ./checkpoint/pretrained/vitcope_pretrained.pth  # 61.31%
img_scale: [1333, 800]
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64
use_cls_token: false
pool: mean
n_epochs: 12  # 1x schedule
lr: 5e-5  # 1e-4 * (bs/16) with bs=8
min_lr: 0.000001
warmup_iters: 1000
weight_decay: 0.05
opt: adamw
betas: [0.9, 0.999]
amp: true
nowandb: false
