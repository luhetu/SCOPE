# configs/detection_swin.yaml - Swin Transformer + Mask R-CNN
task: det
model: swin

# Data configuration
data_dir: /home3/dnrx52/SCOPE/datasets/coco
bs: 2  # Two images per GPU, aligned with official 1x (total batch 16), then scale LR proportionally
img_scale: [1333, 800]  # COCO 1x training standard size (short side 800)
pretrained: ./checkpoint/swin_custom_pretrain.pth  # Use custom pre-trained weights
det_neck_type: fpn  # Paper-style Mask R-CNN + FPN

# Swin Transformer configuration (aligned with mask_rcnn_swin-t-p4-w7_fpn_1x_coco)
size: 224  # Keep train.py's shared dense-task summary fields available
patch: 4
embed_dim: 96
depths: [2, 2, 6, 2]
num_heads: [3, 6, 12, 24]
window_size: 7
drop_path_rate: 0.2  # Official default

# Training configuration (1x schedule)
n_epochs: 12
lr: 1.25e-5          # 0.0001 * (bs/16), scaled by batch=2
min_lr: 0
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

