# configs/detection_swin.yaml - Swin Transformer + Mask R-CNN
task: det
model: swin

# 数据配置
data_dir: ./datasets/coco
bs: 4
pretrained: null  # 预训练权重路径，例如: ./checkpoint/swin_best.pth

# Swin Transformer 配置
size: 224
patch: 4
embed_dim: 96
depths: [2, 2, 6, 2]
num_heads: [3, 6, 12, 24]
window_size: 7
drop_path_rate: 0.1

# 训练配置
n_epochs: 12
lr: 2e-4  # bs=4, 学习率相应调整
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

