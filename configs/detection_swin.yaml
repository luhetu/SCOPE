# configs/detection_swin.yaml - Swin Transformer + Mask R-CNN
task: det
model: swin

# 数据配置
data_dir: /home/hetu/MY project/SCOPE/datasets/coco
bs: 2  # 检测任务显存占用大，batch size 要小

# Swin Transformer 配置
size: 224
patch: 4
embed_dim: 96
depths: [2, 2, 6, 2]
num_heads: [3, 6, 12, 24]
window_size: 7
drop_path_rate: 0.1

# 训练配置
n_epochs: 12
lr: 1e-4
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

