# configs/vitscope_bs1024.yaml - 大batch size测试
task: cls
model: vitscope
data_dir: /home2/dnrx52/vitcope
bs: 1024               # 4倍于原始256
num_workers: 4
size: 224
n_epochs: 100
patch: 32
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 1.2e-3             # 4倍学习率 (3e-4 * 4)
min_lr: 4e-5
warmup_epochs: 5       # 大batch size需要更长warmup
opt: adamw
amp: true
aug: true
nowandb: false




