task: cls
model: vitcope
data_dir: /home/hetu/ImageNet
bs: 128  # 减少 batch size 以避免 OOM（CoPE 需要创建大的 [B,H,N,N] 张量）
size: 224
n_epochs: 100
patch: 16  # ViT-Tiny 配置
dim: 192   # ViT-Tiny 配置
depth: 12  # ViT-Tiny 配置
heads: 3   # ViT-Tiny 配置
mlp_dim: 768  # ViT-Tiny 配置
dim_head: 64
lr: 1.5e-4  # bs=128，学习率线性缩放（256→128，3e-4→1.5e-4）
min_lr: 1e-5
warmup_epochs: 2
opt: adamw
amp: true
aug: false             # 关闭RandAugment减轻CPU负担
nowandb: false