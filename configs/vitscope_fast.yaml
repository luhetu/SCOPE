# configs/vitscope_fast.yaml - 快速训练配置（简化数据增强）
task: cls
model: vitscope
data_dir: /home2/dnrx52/vitcope
bs: 768                # 适中的batch size
num_workers: 4
size: 224
n_epochs: 100
patch: 32
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 9e-4
min_lr: 3e-5
warmup_epochs: 3
opt: adamw
amp: true
aug: false             # 关闭RandAugment，减少CPU负担
nowandb: false




