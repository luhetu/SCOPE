# configs/vitscope_bs2048.yaml - Extra large batch size test
task: cls
model: vitscope
data_dir: /home2/dnrx52/vitcope
bs: 2048               # 8x original 256
num_workers: 4
size: 224
n_epochs: 100
patch: 32
dim: 384
depth: 12
heads: 6
mlp_dim: 1536
dim_head: 64
lr: 2.4e-3             # 8x learning rate (3e-4 * 8)
min_lr: 8e-5
warmup_epochs: 10      # Extra large batch size requires longer warmup
opt: adamw
amp: false
aug: false
nowandb: false



