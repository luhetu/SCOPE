# configs/detection_vitcope.yaml - ViT+CoPE + Mask R-CNN
task: det
model: vitcope

# Data configuration
data_dir: /home3/dnrx52/SCOPE/datasets/coco
bs: 8
pretrained: ./checkpoint/pretrained/vitcope_pretrained.pth
img_scale: [768, 768]  # Fully consistent with ViT

# ViT+CoPE configuration (Tiny)
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# Training configuration - Fully consistent with ViT
n_epochs: 12
lr: 0.0001
min_lr: 0.000001
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

