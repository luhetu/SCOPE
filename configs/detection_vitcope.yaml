# configs/detection_vitcope.yaml - ViT+CoPE + Mask R-CNN
task: det
model: vitcope

# 数据配置
data_dir: ./datasets/coco
bs: 4
pretrained: null  # 预训练权重路径，例如: ./checkpoint/vitcope_embed_best.pth
img_scale: (512, 512)  # 降低分辨率以支持大batch

# ViT+CoPE 配置 (Tiny)
size: 224
patch: 16
dim: 192
depth: 12
heads: 3
mlp_dim: 768
dim_head: 64

# 训练配置
n_epochs: 12
lr: 2e-4  # bs=4, 学习率相应调整
min_lr: 1e-6
warmup_epochs: 1
weight_decay: 0.05
opt: adamw
amp: true
nowandb: false

