# configs/seg_swin.yaml - Swin Transformer + UPerNet for ADE20K
task: seg
model: swin

# Data configuration
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 2  # Segmentation tasks require large memory, batch size should be small

# Swin Transformer configuration
size: 224
test_img_scale: [2048, 512]
img_scale: [2048, 512]
crop_size: 512
patch: 4
embed_dim: 96
depths: [2, 2, 6, 2]
num_heads: [3, 6, 12, 24]
window_size: 7
drop_path_rate: 0.3

# Training configuration
n_epochs: 80  # 80k iterations / 1000 per epoch
lr: 6e-5
min_lr: 1e-6
warmup_epochs: 1
warmup_iters: 1500
weight_decay: 0.01
opt: adamw
amp: false
nowandb: false

