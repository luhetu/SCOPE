# configs/seg_vitscope_v2.yaml - ViT+SCoPE + UPerNet (40K iterations, optimized version)
task: seg
model: vitscope

# Data configuration
data_dir: ./datasets/ADE20K/ADEChallengeData2016
bs: 16  # 🔧 Optimization 1: increased from 8 to 16, speeds up training 1.5x
pretrained: ./checkpoint/pretrained/vitcope_pretrained.pth  # 🔧 Optimization 2: use CoPE pre-trained weights (unified)

# ViT+SCoPE configuration (Tiny - paper aligned)
size: 512
patch: 16  # ViT-Tiny configuration
dim: 192   # ViT-Tiny configuration
depth: 12  # ViT-Tiny configuration
heads: 3   # ViT-Tiny configuration
mlp_dim: 768  # ViT-Tiny configuration
dim_head: 64

# Training configuration (40K iterations - paper standard settings)
n_epochs: 32  # 32 epochs × 1263 iters/epoch ≈ 40,416 iterations
lr: 6e-5  # 🔧 Optimization 3: double the learning rate (corresponding to doubled bs)
min_lr: 0
warmup_epochs: 0.9
weight_decay: 0.01
opt: adamw
amp: true  # 🚀 Mixed precision training, speeds up 40-60%
nowandb: false

# Paper reference: "We adopt UperNet and train for 40K iterations"
# Expected performance: 28-29% mIoU (vs CoPE 27-28%)
# Training time: ~4 hours (A6000, bs=16, AMP enabled)

